name: Build GUI

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        if: github.ref_type == 'tag'
      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/$RELEASE_TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" --title "$RELEASE_TAG" --notes-file "$notes" --draft
          else
            gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" --title "$RELEASE_TAG" --generate-notes --draft
          fi

  build:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp version and update token
        shell: python
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          import os
          import pathlib
          import re

          version_file = pathlib.Path("app/version.py")
          version_text = version_file.read_text(encoding="utf-8")

          if os.environ["REF_TYPE"] == "tag":
              version = os.environ["REF_NAME"].removeprefix("v")
              if not re.fullmatch(r"[0-9]+(?:\.[0-9]+)*", version):
                  raise SystemExit(f"Invalid release version: {version}")

              pattern = r'^__version__\s*=\s*["\'][^"\']*["\']\s*$'
              replacement = f'__version__ = "{version}"'
              version_text, count = re.subn(
                  pattern,
                  replacement,
                  version_text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit("app/version.py does not contain exactly one __version__ assignment")

              version_file.write_text(version_text, encoding="utf-8")

          required = (
              "APP_NAME",
              "__version__",
              "__build_date__",
              "PUBLISHER",
              "REPOSITORY_NAME",
          )
          namespace = {}
          exec(
              compile(version_file.read_text(encoding="utf-8"), str(version_file), "exec"),
              namespace,
          )
          missing = [name for name in required if name not in namespace]
          if missing:
              raise SystemExit(
                  "Missing application metadata in app/version.py: " + ", ".join(missing)
              )

          token = os.environ.get("UPDATE_TOKEN", "")
          cfg = pathlib.Path("app/update_config.py")
          cfg_text = cfg.read_text(encoding="utf-8")
          placeholder = 'UPDATE_TOKEN = ""'
          if placeholder not in cfg_text:
              raise SystemExit("Could not find UPDATE_TOKEN placeholder in app/update_config.py")
          cfg.write_text(
              cfg_text.replace(placeholder, f'UPDATE_TOKEN = "{token}"', 1),
              encoding="utf-8",
          )
      - run: pip install -r requirements.txt pyinstaller
      - uses: mamba-org/setup-micromamba@v2
        id: ocr-env
        with:
          environment-name: ocr
          create-args: -c conda-forge tesseract=5.5.3
          init-shell: none
          micromamba-root-path: ${{ runner.temp }}/micromamba
      - name: Prepare Tesseract bundle
        shell: bash
        env:
          OCR_PREFIX: ${{ steps.ocr-env.outputs.environment-path }}
          OCR_CACHE: ${{ runner.temp }}/micromamba/pkgs
        run: python scripts/prepare_tesseract_bundle.py --prefix "$OCR_PREFIX" --cache "$OCR_CACHE" --output "$RUNNER_TEMP/tesseract-bundle"
      - name: Prepare Ollama runtime bundle
        shell: bash
        run: python scripts/prepare_ollama_bundle.py --output "$RUNNER_TEMP/ollama-bundle"
      - run: python build_exe.py
        env:
          TESSERACT_BUNDLE_DIR: ${{ runner.temp }}/tesseract-bundle
          OLLAMA_BUNDLE_DIR: ${{ runner.temp }}/ollama-bundle/ollama-runtime
      - name: Remove build-time OCR environment from its original location
        shell: python
        env:
          OCR_PREFIX: ${{ steps.ocr-env.outputs.environment-path }}
        run: |
          import os
          from pathlib import Path
          prefix = Path(os.environ["OCR_PREFIX"])
          prefix.rename(prefix.with_name(prefix.name + "-moved"))
      - name: Selftest packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist/JobManager/JobManager.exe -ArgumentList "--selftest-require-bundled-ocr", "--selftest-require-bundled-ollama" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Selftest failed with exit code $($p.ExitCode)" }
      - name: Zip Windows app folder
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          root = Path("dist/JobManager")
          with zipfile.ZipFile("dist/JobManager-windows.zip", "w", zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in root.rglob("*"):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
          if Path("dist/JobManager-windows.zip").stat().st_size >= 2 * 1024**3:
              raise SystemExit("Windows release asset exceeds GitHub's 2 GiB limit.")
          PY
      - name: Selftest packaged app (macOS)
        if: runner.os == 'macOS'
        run: dist/JobManager.app/Contents/MacOS/JobManager --selftest-require-bundled-ocr --selftest-require-bundled-ollama
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: cd dist && zip -ry JobManager-macos.zip JobManager.app
      - name: Upload Windows release asset
        if: github.ref_type == 'tag' && runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/JobManager-windows.zip --repo "${{ github.repository }}" --clobber
      - name: Upload macOS release asset
        if: github.ref_type == 'tag' && runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/JobManager-macos.zip --repo "${{ github.repository }}" --clobber
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: JobManager-${{ runner.os }}
          path: |
            dist/JobManager-windows.zip
            dist/JobManager-macos.zip

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest

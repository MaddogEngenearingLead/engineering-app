name: Build GUI

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp version and update token
        shell: python
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          import os, pathlib
          if os.environ["REF_TYPE"] == "tag":
              version = os.environ["REF_NAME"].lstrip("v")
              pathlib.Path("app/version.py").write_text(f'__version__ = "{version}"\n')
          token = os.environ.get("UPDATE_TOKEN", "")
          cfg = pathlib.Path("app/update_config.py")
          cfg.write_text(cfg.read_text().replace('UPDATE_TOKEN = ""', f'UPDATE_TOKEN = "{token}"'))
      - run: pip install tkinterdnd2==0.4.2 pyinstaller pdfplumber reportlab python-docx openpyxl httpx
      - run: python build_exe.py
      - name: Selftest packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist/JobManager.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Selftest failed with exit code $($p.ExitCode)" }
      - name: Selftest packaged app (macOS)
        if: runner.os == 'macOS'
        run: dist/JobManager.app/Contents/MacOS/JobManager --selftest
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: cd dist && zip -r JobManager-macos.zip JobManager.app
      - uses: actions/upload-artifact@v4
        with:
          name: JobManager-${{ runner.os }}
          path: |
            dist/JobManager.exe
            dist/JobManager-macos.zip

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" assets/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes

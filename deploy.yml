yaml
name: Industrial Dashboard CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  test-and-lint:
    name: Code Verification & Safety Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      - name: Syntax Audit & Code Quality Linting
        run: |
          # Stop the build process instantly if there are critical syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning flags for formatting style issues (exit-zero handles warnings gracefully)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build-and-push-image:
    name: Package Docker Container to Registry
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # Only push container builds to production on direct commits
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure Docker Buildx Engine
        uses: actions/setup-buildx-action@v3

      - name: Secure Log In to GitHub Container Registry (GHCR)
        uses: actions/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Dynamic Image Meta Labels
        id: meta
        uses: actions/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend-engine
          tags: |
            type=raw,value=latest
            type=sha,value=${{ github.sha }}

      - name: Build and Push Production Container Image
        uses: actions/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
